<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nodi ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(15px);
  padding:35px;
  border-radius:25px;
  text-align:center;
  width:320px;
  color:white;
  position:relative;
}

h2{
  margin-bottom:10px;
}

#message{
  height:24px;
  font-size:14px;
  margin-bottom:10px;
}

button{
  padding:10px 25px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
  position:absolute;
}

#yesBtn{
  background:#ff2e63;
  color:white;
  left:50%;
  transform:translateX(-50%);
  bottom:70px;
}

#noBtn{
  background:white;
  color:#ff2e63;
  left:50%;
  transform:translateX(-50%);
  bottom:20px;
}

#letterPage{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  padding:40px;
  box-sizing:border-box;
  color:white;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h2>Will You Be My Valentine? 💌</h2>
  <div id="message"></div>
  <button id="yesBtn">Yes ❤️</button>
  <button id="noBtn">No 💔</button>
</div>

<div id="letterPage">
  <h2>For Nodi 💖</h2>
  <p>
  My Dearest Nodi,<br><br>
  You make my world softer, warmer and brighter.
  I promise care, honesty and endless effort.<br><br>
  Will you be my Valentine? 💕<br><br>
  With love,<br>
  <b>Pritam 💌</b>
  </p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");
const letterPage = document.getElementById("letterPage");
const message = document.getElementById("message");

let count = 0;

const texts = [
  "Are you sure? 🥺",
  "Please reconsider... 🥹",
  "Think again... 😔",
  "Last chance 😏"
];

// YES
yesBtn.onclick = () => {
  card.style.display = "none";
  letterPage.style.display = "block";
};

// NO (mobile touch dodge)
noBtn.addEventListener("touchstart", function(e){
  e.preventDefault();

  if(count < texts.length){
    message.innerText = texts[count];
  } else {
    message.innerText = "You can't catch me 😜";
  }

  count++;
  moveButton();
});

function moveButton(){
  const cardRect = card.getBoundingClientRect();

  const maxX = cardRect.width - noBtn.offsetWidth;
  const maxY = cardRect.height - noBtn.offsetHeight - 80;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";
}
</script>

</body>
</html>
