<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nodi ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.4);
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    width: 350px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    color: white;
}

h1 {
    margin-bottom: 25px;
}

button {
    padding: 10px 25px;
    margin: 15px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background: #ff2e63;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background: white;
    color: #ff2e63;
    position: absolute;
}

/* Custom popup */
#popup {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 15px 25px;
    border-radius: 20px;
    display: none;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    font-weight: bold;
}

/* Letter Page */
#letterPage {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow-y: auto;
    padding: 40px;
    box-sizing: border-box;
    color: white;
}

.letter-box {
    max-width: 700px;
    margin: auto;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div id="popup"></div>

<div class="card" id="mainCard">
    <h1>Will You Be My Valentine? 💌</h1>
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
</div>

<div id="letterPage">
    <div class="letter-box">
        <h2>For Nodi 💖</h2>
        <p>
        My Dearest Nodi,<br><br>
        From the very first moment you came into my life, something changed.
        Ordinary days became special. You bring calm, warmth, and happiness
        into my world
