<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nodi ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}

.card{
  width:90%;
  max-width:350px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(15px);
  padding:30px;
  border-radius:25px;
  text-align:center;
  color:white;
  position:relative;
}

#message{
  height:30px;
  margin-bottom:15px;
  font-size:14px;
}

.buttons{
  position:relative;
  height:130px;
}

button{
  width:110px;              /* FIXED WIDTH */
  height:40px;              /* FIXED HEIGHT */
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
  position:absolute;
}

#yesBtn{
  background:#ff2e63;
  color:white;
  left:50%;
  margin-left:-55px;        /* center without transform */
  top:20px;
}

#noBtn{
  background:white;
  color:#ff2e63;
  left:50%;
  margin-left:-55px;        /* center without transform */
  top:70px;
}

#letterPage{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  padding:40px;
  box-sizing:border-box;
  color:white;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h2>Will You Be My Valentine? 💌</h2>
  <div id="message"></div>

  <div class="buttons" id="btnContainer">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<div id="letterPage">
  <h2>For Nodi 💖</h2>
  <p>
  My Dearest Nodi,<br><br>
  You make my world softer, warmer and brighter.
  I promise care, honesty and endless effort.<br><br>
  Will you be my Valentine? 💕<br><br>
  With love,<br>
  <b>Pritam 💌</b>
  </p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");
const container = document.getElementById("btnContainer");
const card = document.getElementById("card");
const letterPage = document.getElementById("letterPage");

let count = 0;

const texts = [
  "Are you sure? 🥺",
  "Please reconsider... 🥹",
  "Think again... 😔"
];

yesBtn.onclick = () => {
  card.style.display = "none";
  letterPage.style.display = "block";
};

noBtn.addEventListener("click", function(){

  if(count < 3){
    message.innerText = texts[count];
  } else {
    message.innerText = "Catch me if you can 😜";
    moveButton();
  }

  count++;
});

function moveButton(){
  const rect = container.getBoundingClientRect();

  const maxX = rect.width - noBtn.offsetWidth;
  const maxY = rect.height - noBtn.offsetHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";
}
</script>

</body>
</html>
